
<body style="font-family: Arial, sans-serif; margin: 0; padding-bottom: 50px;">
    <div style="max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 10px;">  
        <h2 style="text-align: center; margin-top: 0; color: blue;">Send us Your Feedback</h2>
        <form>
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Name :</label>
                <input type="text" style="width: 100%; padding: 8px; border: 1px solid #364958; border-radius: 4px; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Email :</label>
                <input type="email" style="width: 100%; padding: 8px; border: 1px solid #364958; border-radius: 4px; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Message :</label>
                <textarea style="width: 100%; padding: 8px; border: 1px solid #364958; border-radius: 4px; min-height: 100px; box-sizing: border-box;"></textarea>
            </div>
            <button type="submit" style="width: 100%; padding: 10px; background-color: #364958; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
                Submit Feedback
            </button>
        </form>
    </div>
</body>
